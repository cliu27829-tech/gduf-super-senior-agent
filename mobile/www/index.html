<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>广金万事屋师兄</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="广金万事屋">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        #app-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=pixel%20art%20anime%20girl%20with%20black%20ponytail%20hair%20brown%20eyes%20school%20uniform%20beige%20vest%20white%20background%20cute%20style&image_size=square_hd') center/cover no-repeat;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        .loading-text {
            color: white;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .loading-subtext {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 8px;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
        .error-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            padding: 20px;
            text-align: center;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }
        .error-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .retry-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .retry-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading">
        <div class="loading-icon"></div>
        <div class="loading-text">广金万事屋师兄</div>
        <div class="loading-subtext">正在连接服务器...</div>
    </div>
    
    <div class="error-screen" id="error" style="display: none;">
        <div class="error-icon">📡</div>
        <div class="error-title">连接失败</div>
        <div class="error-message">无法连接到服务器，请检查网络连接后重试</div>
        <button class="retry-btn" onclick="retryConnection()">重试连接</button>
    </div>
    
    <div id="app-container">
        <iframe id="app-iframe" src="http://136.175.178.35:8501" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <script>
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const iframe = document.getElementById('app-iframe');
        
        let connectionTimeout;
        
        function showError() {
            loading.classList.add('hidden');
            error.style.display = 'flex';
        }
        
        function hideError() {
            error.style.display = 'none';
            loading.classList.remove('hidden');
        }
        
        function retryConnection() {
            hideError();
            iframe.src = iframe.src;
        }
        
        iframe.addEventListener('load', function() {
            clearTimeout(connectionTimeout);
            loading.classList.add('hidden');
        });
        
        iframe.addEventListener('error', function() {
            showError();
        });
        
        connectionTimeout = setTimeout(function() {
            showError();
        }, 10000);
    </script>
</body>
</html>
