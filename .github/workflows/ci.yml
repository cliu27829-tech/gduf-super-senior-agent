name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app
      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Migrate and start test services
        env:
          DATABASE_URL: sqlite:////tmp/gduf-e2e.db
          ENVIRONMENT: test
          AUTO_CREATE_SCHEMA: "false"
          SEED_DEMO_DATA: "true"
          DEEPSEEK_API_KEY: ""
        run: |
          cd backend
          python -m alembic upgrade head
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/gduf-backend.log 2>&1 &
          cd ../frontend
          nohup npm run dev -- --host 127.0.0.1 >/tmp/gduf-frontend.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for url in ("http://127.0.0.1:8000/ready", "http://127.0.0.1:5173/"):
              for _ in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f"service did not start: {url}")
          PY
      - name: Run browser workflow
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:e2e
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed local secrets
        shell: bash
        run: |
          test ! -f .env
          test ! -f backend/.env
          test ! -f frontend/.env
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,})' -- ':!*.md'; then
            echo "Potential secret detected"
            exit 1
          fi
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build and start Docker MVP
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Stop Docker MVP
        if: always()
        run: docker compose down -v
