<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>广金大师兄</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="广金大师兄">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        #app-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        .loading-icon::after {
            content: '🎓';
            display: grid;
            place-items: center;
            height: 100%;
            font-size: 44px;
        }
        .loading-text {
            color: white;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .loading-subtext {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 8px;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
        .error-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            padding: 20px;
            text-align: center;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }
        .error-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .retry-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .retry-btn:hover {
            background: #c0392b;
        }
        .config-screen {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            place-items: center;
            background: #f5f5f5;
            padding: 24px;
        }
        .config-card { max-width: 520px; width: 100%; }
        .config-card h1 { margin-bottom: 12px; }
        .config-card p { color: #666; line-height: 1.6; margin-bottom: 16px; }
        .config-card input {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
            font-size: 16px; margin-bottom: 12px;
        }
        .config-error { color: #b42318; min-height: 24px; }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading">
        <div class="loading-icon"></div>
        <div class="loading-text">广金大师兄</div>
        <div class="loading-subtext">正在连接服务器...</div>
    </div>
    
    <div class="error-screen" id="error" style="display: none;">
        <div class="error-icon">📡</div>
        <div class="error-title">连接失败</div>
        <div class="error-message">无法连接到服务器，请检查网络连接后重试</div>
        <button class="retry-btn" onclick="retryConnection()">重试连接</button>
        <button class="retry-btn" onclick="showConfiguration()" style="margin-top: 12px;">更换服务器</button>
    </div>

    <div class="config-screen" id="configuration">
        <div class="config-card">
            <h1>配置广金大师兄</h1>
            <p>请输入已部署的 HTTPS Streamlit 地址。地址只保存在本设备，安装包不再写死公网 IP。</p>
            <input id="server-url" type="url" inputmode="url" placeholder="https://your-app.streamlit.app">
            <div class="config-error" id="config-error"></div>
            <button class="retry-btn" onclick="saveConfiguration()">保存并连接</button>
        </div>
    </div>
    
    <div id="app-container">
        <iframe id="app-iframe" title="广金大师兄" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>
    </div>

    <script>
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const iframe = document.getElementById('app-iframe');
        const configuration = document.getElementById('configuration');
        const serverUrlInput = document.getElementById('server-url');
        const configError = document.getElementById('config-error');
        
        let connectionTimeout;
        
        function showError() {
            loading.classList.add('hidden');
            error.style.display = 'flex';
        }
        
        function hideError() {
            error.style.display = 'none';
            loading.classList.remove('hidden');
        }
        
        function retryConnection() {
            hideError();
            iframe.src = iframe.src;
        }

        function isAllowedUrl(value) {
            try {
                const parsed = new URL(value);
                return parsed.protocol === 'https:' ||
                    (parsed.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(parsed.hostname));
            } catch (_) {
                return false;
            }
        }

        function showConfiguration() {
            error.style.display = 'none';
            loading.classList.add('hidden');
            serverUrlInput.value = localStorage.getItem('gdufAgentUrl') || '';
            configuration.style.display = 'grid';
        }

        function saveConfiguration() {
            const value = serverUrlInput.value.trim().replace(/\/$/, '');
            if (!isAllowedUrl(value)) {
                configError.textContent = '请输入 HTTPS 地址（本机调试可使用 localhost HTTP）。';
                return;
            }
            configError.textContent = '';
            localStorage.setItem('gdufAgentUrl', value);
            configuration.style.display = 'none';
            loading.classList.remove('hidden');
            iframe.src = value;
            startConnectionTimeout();
        }
        
        iframe.addEventListener('load', function() {
            clearTimeout(connectionTimeout);
            loading.classList.add('hidden');
        });
        
        iframe.addEventListener('error', function() {
            showError();
        });
        
        function startConnectionTimeout() {
            clearTimeout(connectionTimeout);
            connectionTimeout = setTimeout(showError, 10000);
        }

        const configuredUrl = localStorage.getItem('gdufAgentUrl');
        if (configuredUrl && isAllowedUrl(configuredUrl)) {
            iframe.src = configuredUrl;
            startConnectionTimeout();
        } else {
            showConfiguration();
        }
    </script>
</body>
</html>
